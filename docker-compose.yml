services:
  spese:
    build: .
    image: spese:dev
    container_name: spese
    env_file:
      - .env
    ports:
      - "${SPESE_PORT:-8081}:${SPESE_PORT:-8081}"
    environment:
      - SPESE_PORT=${SPESE_PORT:-8081}
      - SPESE_DB_PATH=/data/spese.db
      - HONKER_EXTENSION_PATH=${HONKER_EXTENSION_PATH}
      # Google Sheets configuration
      - GOOGLE_SPREADSHEET_ID=${GOOGLE_SPREADSHEET_ID}
      # Service Account credentials for Google Sheets access
      - GOOGLE_SERVICE_ACCOUNT_FILE=/service-account.json
    volumes:
      - ./configs/service-account.json:${GOOGLE_SERVICE_ACCOUNT_FILE:-/service-account.json}:ro
      - spese_data:/data
    restart: unless-stopped

volumes:
  spese_data:
