services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: spese-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - spese_rabbitmq:/var/lib/rabbitmq
    restart: unless-stopped

  spese:
    build: .
    image: spese:dev
    container_name: spese
    depends_on:
      - rabbitmq
    ports:
      - "${SPESE_PORT:-8080}:${SPESE_PORT:-8080}"
    environment:
      - SPESE_PORT=${SPESE_PORT:-8080}
      - SPESE_DB_PATH=/data/spese.db
      - SPESE_RABBITMQ_URL=${SPESE_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - SPESE_RABBITMQ_QUEUE=${SPESE_RABBITMQ_QUEUE:-spese.sheet-sync}
      - SPESE_WORKER_MODE=${SPESE_WORKER_MODE:-daemon}
      - SPESE_SHEETS_WRITE_RATE_PER_MINUTE=${SPESE_SHEETS_WRITE_RATE_PER_MINUTE:-10}
      - SPESE_LOCAL_SHEET_PATH=${SPESE_LOCAL_SHEET_PATH:-/data/local-sheet.json}
      - SPESE_SHEET_MIRROR_BACKEND=${SPESE_SHEET_MIRROR_BACKEND:-local}
    volumes:
      - spese_data:/data
    restart: unless-stopped

  spese-worker:
    build: .
    image: spese:dev
    container_name: spese-worker
    command: ["/app/spese-worker"]
    depends_on:
      - rabbitmq
      - spese
    environment:
      - SPESE_DB_PATH=/data/spese.db
      - SPESE_RABBITMQ_URL=${SPESE_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      - SPESE_RABBITMQ_QUEUE=${SPESE_RABBITMQ_QUEUE:-spese.sheet-sync}
      - SPESE_LOCAL_SHEET_PATH=${SPESE_LOCAL_SHEET_PATH:-/data/local-sheet.json}
      - SPESE_SHEET_MIRROR_BACKEND=${SPESE_SHEET_MIRROR_BACKEND:-local}
    volumes:
      - spese_data:/data
    restart: unless-stopped

volumes:
  spese_data:
  spese_rabbitmq:
