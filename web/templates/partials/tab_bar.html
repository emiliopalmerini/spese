{{ define "tab_bar" }}
<nav class="tabbar" aria-label="Navigazione principale">
  <a class="tabbar__tab" href="/" data-tab="diario"
     {{if eq .Tab "diario"}}aria-current="page"{{end}}>
    <span class="tabbar__label">Diario</span>
  </a>
  <a class="tabbar__tab" href="/recurrent" data-tab="ricorrenti"
     {{if eq .Tab "ricorrenti"}}aria-current="page"{{end}}>
    <span class="tabbar__label">Ricorrenti</span>
  </a>
  <button class="tabbar__fab" id="fabTab" type="button" aria-label="Aggiungi">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19"></line>
      <line x1="5" y1="12" x2="19" y2="12"></line>
    </svg>
  </button>
  <a class="tabbar__tab" href="/entrate" data-tab="entrate"
     {{if eq .Tab "entrate"}}aria-current="page"{{end}}>
    <span class="tabbar__label">Entrate</span>
  </a>
  <a class="tabbar__tab" href="/spese" data-tab="spese"
     {{if eq .Tab "spese"}}aria-current="page"{{end}}>
    <span class="tabbar__label">Spese</span>
  </a>
</nav>
{{ end }}
