{{ define "category_breakdown" }}
{{if .HasData}}
<div class="cat-panel">
  <div class="cat-panel__chart">
    {{ donut (dict "Data" .DonutData "Size" 120 "Thickness" 16 "Bg" "rgba(26,22,18,0.06)") }}
  </div>
  <div class="cat-panel__rows">
    {{range .Categories}}
    <div class="cat-row">
      <span class="cat-row__dot" style="background:{{.Color}}"></span>
      <span class="cat-row__name">{{.Name}}</span>
      <span class="cat-row__pct label-mono">{{.Percent}}%</span>
      <span class="cat-row__amt">{{.Amount}}</span>
    </div>
    {{end}}
  </div>
</div>
{{else}}
<div class="empty-state">
  <p class="text-muted">Nessuna spesa questo mese</p>
</div>
{{end}}
{{ end }}
