{{define "title"}}Conti · Spese{{end}}
{{define "content"}}
<section class="page accounts">
  <header class="page-head">
    <h1>Conti</h1>
    <p class="muted">Piano dei conti (asset e passività).</p>
  </header>

  <table class="data-table">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Tipo</th>
        <th>Classe</th>
        <th>Valuta</th>
        <th>Note</th>
      </tr>
    </thead>
    <tbody>
      {{range .Accounts}}
        <tr>
          <td data-label="Nome">{{.Name}}</td>
          <td data-label="Tipo">{{.Type}}</td>
          <td data-label="Classe">{{.Class}}</td>
          <td data-label="Valuta">{{.Currency}}</td>
          <td class="muted" data-label="Note">{{.Note}}</td>
        </tr>
      {{else}}
        <tr><td colspan="5" class="muted">Nessun conto.</td></tr>
      {{end}}
    </tbody>
  </table>

</section>
{{end}}
