{{define "title"}}Dashboard · Spese{{end}}
{{define "content"}}
<section class="page dashboard">
  <header class="page-head">
    <h1>Dashboard</h1>
  </header>
  <dl class="kpi-list">
    {{range .Items}}
      {{if eq .Label ""}}
        <div class="kpi-divider"></div>
      {{else if eq .Value ""}}
        <dt class="kpi-section">{{.Label}}</dt>
      {{else}}
        <div class="kpi-row">
          <dt>{{.Label}}</dt>
          <dd>{{.Value}}</dd>
        </div>
      {{end}}
    {{end}}
  </dl>
</section>
{{end}}
