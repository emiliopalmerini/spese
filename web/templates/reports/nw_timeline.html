{{define "title"}}Patrimonio nel tempo · Spese{{end}}
{{define "content"}}
<section class="page report">
  <header class="page-head">
    <h1>Patrimonio nel tempo</h1>
    <p class="muted">Patrimonio netto totale, mese per mese.</p>
  </header>
  <table class="data-table">
    <thead>
      <tr>
        <th>Mese</th>
        <th class="num">Patrimonio</th>
      </tr>
    </thead>
    <tbody>
      {{range .Rows}}
        <tr>
          <td data-label="Mese">{{monthIT .Month}}</td>
          <td class="num" data-label="Patrimonio">{{money .NetWorth}}</td>
        </tr>
      {{else}}
        <tr><td colspan="2" class="muted">Nessun dato.</td></tr>
      {{end}}
    </tbody>
  </table>
</section>
{{end}}
