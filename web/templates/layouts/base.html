{{define "base"}}<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{block "title" .}}Spese{{end}}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx-1.9.12.min.js" defer></script>
  <script src="/static/global-actions.js" defer></script>
  <script src="/static/dictation.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Vai al contenuto</a>
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="/" aria-label="Spese dashboard"{{if eq (currentSection) "dashboard"}} aria-current="page"{{end}}>
        <span class="brand__mark">S</span>
        <span>Spese</span>
      </a>
      <nav class="nav" aria-label="Principale">
        <a href="/transactions" data-nav-section="transactions"{{if eq (currentSection) "transactions"}} aria-current="page"{{end}}>Movimenti</a>
        <a href="/accounts" data-nav-section="accounts"{{if eq (currentSection) "accounts"}} aria-current="page"{{end}}>Conti</a>
        <a href="/reports" data-nav-section="reports"{{if eq (currentSection) "reports"}} aria-current="page"{{end}}>Report</a>
      </nav>
    </div>
  </header>
  <main class="container" id="main-content" tabindex="-1">
    {{block "content" .}}{{end}}
  </main>
  <div class="app-status" role="status" aria-live="polite" aria-atomic="true" data-app-status hidden></div>
  {{template "global_actions" .}}
</body>
</html>
{{end}}
