{{ define "income_page" }}
<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>Entrate</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/static/expense-form.js" defer></script>
    <script src="/static/income-form.js" defer></script>
    <script src="/static/recurrent-form.js" defer></script>
    <script src="/static/dashboard.js" defer></script>
  </head>
  <body class="theme-ink density-comfortable style-minimal">
    {{ template "topbar" (dict "Tab" "entrate") }}
    <main class="container page">
      {{ template "income_content" . }}
    </main>
    {{ template "fab" . }}
    {{ template "tab_bar" (dict "Tab" "entrate") }}
  </body>
</html>
{{ end }}

{{ define "income_content" }}
<div class="container">
  <section class="page__section">
    <h1 class="page__title">Entrate</h1>
  </section>

  <section class="page__section">
    <div id="income-month-overview"
         hx-get="/ui/income-month-overview"
         hx-trigger="load, income-overview:refresh from:body, income:deleted from:body"
         hx-target="#income-month-overview"
         hx-swap="outerHTML">
      <div class="placeholder">Caricamento panoramica…</div>
    </div>
  </section>
</div>
{{ end }}
