{{ define "networth_page" }}
<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f1e8" />
    <title>Patrimonio</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body class="theme-ink density-comfortable style-minimal">
    {{ template "topbar" (dict "Tab" "networth") }}
    <main class="container page">
      {{ template "networth_content" . }}
    </main>
    {{ template "fab" . }}
    {{ template "tab_bar" (dict "Tab" "networth") }}
  </body>
</html>
{{ end }}

{{ define "networth_content" }}
<div class="container">
  <section class="page__section">
    <h1 class="page__title">Patrimonio</h1>
  </section>

  <section class="page__section" x-data="{ year: {{ .Year }}, month: {{ .Month }} }">
    <div class="net-picker">
      <div class="field">
        <label>Anno</label>
        <input type="number" min="2000" max="2999" x-model.number="year"
               @change="htmx.ajax('GET', '/ui/networth/insights?year='+year+'&month='+month, {target:'#networth-insights', swap:'outerHTML'})" />
      </div>
      <div class="field">
        <label>Mese</label>
        <input type="number" min="1" max="12" x-model.number="month"
               @change="htmx.ajax('GET', '/ui/networth/insights?year='+year+'&month='+month, {target:'#networth-insights', swap:'outerHTML'})" />
      </div>
    </div>

    <div id="networth-insights"
         hx-get="/ui/networth/insights?year={{ .Year }}&month={{ .Month }}"
         hx-trigger="load, networth:updated from:body"
         hx-target="#networth-insights"
         hx-swap="outerHTML">
      <div class="placeholder">Caricamento patrimonio...</div>
    </div>
  </section>
</div>
{{ end }}
