{{ define "index_page" }}
<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10b981" />
    <title>Spese</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/style.css" />
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
    <script src="/static/expense-form.js"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  <body class="theme-ink density-comfortable style-minimal">
    {{ template "topbar" (dict "Tab" "spese") }}
    <main class="container page">
      {{ template "index_content" . }}
    </main>
    {{ template "fab" . }}
    {{ template "tab_bar" (dict "Tab" "spese") }}
  </body>
</html>
{{ end }}

{{ define "index_content" }}
<div class="container">
  <section class="page__section">
    <div class="label-mono">Capitolo II</div>
    <h1 class="page__title">Spese</h1>
  </section>

  <section class="page__section">
    <div id="month-overview"
         hx-get="/ui/month-overview"
         hx-trigger="load, overview:refresh from:body, expense:deleted from:body"
         hx-target="#month-overview"
         hx-swap="outerHTML">
      <div class="placeholder">Caricamento panoramica…</div>
    </div>
  </section>
</div>
{{ end }}
